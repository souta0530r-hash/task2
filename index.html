<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase TCG Battler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #e2e8f0;
            overflow-x: hidden;
        }
        .card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            transform-style: preserve-3d;
        }
        .card:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.6);
            z-index: 10;
        }
        .card.selected {
            border-color: #fbbf24;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.8);
            transform: translateY(-10px) scale(1.05);
            z-index: 20;
        }
        .card.enemy-targetable:hover {
            border-color: #ef4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.8);
            cursor: crosshair;
        }
        .card.playable:hover {
            border-color: #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.8);
        }
        .slot {
            transition: all 0.2s;
        }
        .slot.highlight {
            background-color: rgba(59, 130, 246, 0.2);
            border-color: #3b82f6;
            cursor: pointer;
            box-shadow: inset 0 0 15px rgba(59, 130, 246, 0.5);
        }
        .slot.highlight-energy {
            background-color: rgba(251, 191, 36, 0.2);
            border-color: #fbbf24;
            cursor: pointer;
            box-shadow: inset 0 0 15px rgba(251, 191, 36, 0.5);
        }
        /* カスタムスクロールバー */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        .type-badge {
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body class="h-screen flex flex-col relative overflow-hidden">

    <header class="bg-slate-900 border-b border-slate-700 p-3 flex justify-between items-center z-30 relative shadow-lg">
        <div class="flex items-center gap-6">
            <h1 class="text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-500 tracking-tight">
                TCG Battler
            </h1>
            <nav id="main-nav" class="hidden md:flex gap-2">
                <button class="nav-btn bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg font-bold transition text-blue-400" data-target="view-menu">ホーム</button>
                <button class="nav-btn bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg font-bold transition" data-target="view-deck">デッキ・コレクション</button>
            </nav>
        </div>
        
        <div id="auth-section" class="flex items-center gap-4">
            <button id="btn-login" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg shadow-lg transition transform hover:scale-105">
                Google Login
            </button>
            <div id="user-info" class="hidden flex items-center gap-3 bg-slate-800 py-1 px-3 rounded-full border border-slate-700">
                <div class="text-right text-xs">
                    <p id="user-name" class="font-bold text-white"></p>
                    <p class="text-slate-400">Wins: <span id="user-wins" class="text-yellow-400 font-bold">0</span></p>
                </div>
                <img id="user-avatar" src="" alt="Avatar" class="w-8 h-8 rounded-full border border-slate-500">
                <button id="btn-logout" class="text-xs text-red-400 hover:text-red-300 ml-2 transition">ログアウト</button>
            </div>
        </div>
    </header>

    <div id="app-container" class="flex-1 relative w-full h-full overflow-hidden">
        
        <!-- View: Login Overlay (強制レイヤー) -->
        <div id="login-overlay" class="absolute inset-0 bg-slate-950 bg-opacity-90 flex items-center justify-center z-50 backdrop-blur-sm transition-opacity duration-500">
            <div class="text-center bg-slate-800 p-10 rounded-2xl shadow-2xl border border-slate-700 max-w-md w-full mx-4 transform transition-transform scale-100">
                <div class="text-6xl mb-6">🃏</div>
                <h2 class="text-3xl font-black mb-4 bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">TCG BATTLER</h2>
                <p class="text-slate-300 mb-8">デッキを構築し、AIとバトルしよう。<br>ログインしてデータを保存します。</p>
            </div>
        </div>

        <!-- View: Main Menu -->
        <main id="view-menu" class="view-section absolute inset-0 flex flex-col items-center justify-center bg-slate-900 z-10 transition-opacity duration-300">
            <h2 class="text-4xl font-bold mb-8 text-white">メインメニュー</h2>
            <div class="flex flex-col sm:flex-row gap-6">
                <button id="btn-go-battle" class="group relative px-8 py-4 bg-gradient-to-br from-red-600 to-orange-600 rounded-xl font-black text-xl shadow-lg hover:shadow-red-500/50 transition-all hover:scale-105 border border-red-400">
                    バトル開始
                    <span class="block text-xs font-normal text-red-200 mt-1">AIと対戦する</span>
                </button>
                <button id="btn-go-deck" class="group relative px-8 py-4 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-xl font-black text-xl shadow-lg hover:shadow-blue-500/50 transition-all hover:scale-105 border border-blue-400">
                    デッキ編成
                    <span class="block text-xs font-normal text-blue-200 mt-1">カードコレクションを見る</span>
                </button>
            </div>
        </main>

        <!-- View: Deck Builder & Collection -->
        <main id="view-deck" class="view-section absolute inset-0 hidden flex flex-col bg-slate-900 z-10 transition-opacity duration-300">
            <div class="flex-1 flex flex-col md:flex-row h-full overflow-hidden p-4 gap-4">
                
                <!-- Left: Collection (全カードリスト) -->
                <div class="flex-1 flex flex-col bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-lg">
                    <div class="p-3 border-b border-slate-700 bg-slate-800 flex justify-between items-center">
                        <h3 class="font-bold text-lg">カードコレクション (全60種)</h3>
                        <div class="flex gap-2 text-sm">
                            <select id="filter-type" class="bg-slate-700 text-white rounded px-2 py-1 outline-none border border-slate-600">
                                <option value="all">すべて</option>
                                <option value="monster">モンスター</option>
                                <option value="goods">グッズ</option>
                                <option value="support">サポート</option>
                                <option value="energy">エネルギー</option>
                            </select>
                        </div>
                    </div>
                    <div id="collection-grid" class="flex-1 overflow-y-auto p-4 grid grid-cols-3 sm:grid-cols-4 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 content-start">
                        <!-- コレクションのカードがここに生成される -->
                    </div>
                </div>

                <!-- Right: Deck -->
                <div class="w-full md:w-80 lg:w-96 flex flex-col bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-lg h-1/2 md:h-full shrink-0">
                    <div class="p-3 border-b border-slate-700 bg-slate-800 flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-lg text-blue-400">マイデッキ</h3>
                            <p class="text-xs text-slate-400"><span id="deck-count">0</span> / 30 枚 (モンスター等:各4枚まで)</p>
                        </div>
                        <button id="btn-save-deck" class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold py-1 px-3 rounded transition shadow">
                            保存
                        </button>
                    </div>
                    <div id="deck-list" class="flex-1 overflow-y-auto p-2 flex flex-col gap-1">
                        <!-- デッキのカードリスト -->
                    </div>
                </div>
            </div>
        </main>

        <!-- View: Battle -->
        <main id="view-battle" class="view-section absolute inset-0 hidden flex flex-col bg-[url('https://placehold.co/1920x1080/0f172a/1e293b?text=+')] bg-cover bg-center z-10 transition-opacity duration-300">
            
            <!-- 敵エリア -->
            <div class="flex-1 flex flex-col justify-end items-center p-2 gap-2 border-b border-slate-800 bg-slate-900 bg-opacity-60 backdrop-blur-sm relative">
                <div class="absolute top-4 left-4 bg-slate-800 px-4 py-2 rounded-lg border border-red-900 shadow-lg flex items-center gap-4">
                    <div>
                        <p class="text-red-400 font-bold text-sm">Enemy AI</p>
                        <p class="text-2xl font-black">HP: <span id="enemy-hp" class="text-white">20</span></p>
                    </div>
                    <div class="w-12 h-16 border border-slate-600 rounded bg-slate-700 flex items-center justify-center flex-col">
                        <span class="text-xs text-slate-400">Deck</span>
                        <span id="enemy-deck-count" class="font-bold text-lg">30</span>
                    </div>
                </div>
                <!-- 敵手札 -->
                <div id="enemy-hand" class="flex gap-1 sm:gap-2 scale-75 origin-bottom"></div>
                
                <!-- 敵フィールド -->
                <div id="enemy-field" class="flex gap-2 sm:gap-4 min-h-[140px] items-center">
                    <div class="slot w-24 h-32 sm:w-28 sm:h-40 border-2 border-dashed border-slate-600 rounded-xl bg-slate-800 bg-opacity-50"></div>
                    <div class="slot w-24 h-32 sm:w-28 sm:h-40 border-2 border-dashed border-slate-600 rounded-xl bg-slate-800 bg-opacity-50"></div>
                    <div class="slot w-24 h-32 sm:w-28 sm:h-40 border-2 border-dashed border-slate-600 rounded-xl bg-slate-800 bg-opacity-50"></div>
                </div>
            </div>

            <!-- 情報バー (中央) -->
            <div class="h-10 bg-slate-800 border-y border-slate-600 flex justify-center items-center relative z-20 shadow-lg">
                <span id="turn-indicator" class="font-bold text-lg px-6 py-1 rounded-full bg-blue-900 text-blue-200 border border-blue-500 shadow-[0_0_10px_rgba(59,130,246,0.5)]">
                    あなたのターン
                </span>
                <button id="btn-end-turn" class="absolute right-4 bg-yellow-600 hover:bg-yellow-500 text-white font-bold py-1 px-6 rounded-full shadow-lg transition transform hover:scale-105 border border-yellow-400 hidden">
                    ターン終了
                </button>
            </div>

            <!-- プレイヤーエリア -->
            <div class="flex-1 flex flex-col justify-start items-center p-2 gap-2 bg-slate-900 bg-opacity-80 backdrop-blur-sm relative">
                <!-- プレイヤーフィールド -->
                <div id="player-field" class="flex gap-2 sm:gap-4 min-h-[140px] items-center mt-2">
                    <div class="slot player-slot w-24 h-32 sm:w-28 sm:h-40 border-2 border-dashed border-slate-500 rounded-xl bg-slate-800 bg-opacity-50" data-index="0"></div>
                    <div class="slot player-slot w-24 h-32 sm:w-28 sm:h-40 border-2 border-dashed border-slate-500 rounded-xl bg-slate-800 bg-opacity-50" data-index="1"></div>
                    <div class="slot player-slot w-24 h-32 sm:w-28 sm:h-40 border-2 border-dashed border-slate-500 rounded-xl bg-slate-800 bg-opacity-50" data-index="2"></div>
                </div>
                
                <div class="absolute bottom-4 left-4 bg-slate-800 px-4 py-2 rounded-lg border border-blue-900 shadow-lg flex items-center gap-4 z-20">
                    <div class="w-12 h-16 border border-slate-600 rounded bg-slate-700 flex items-center justify-center flex-col cursor-pointer hover:bg-slate-600 transition" title="山札">
                        <span class="text-xs text-slate-400">Deck</span>
                        <span id="player-deck-count" class="font-bold text-lg">30</span>
                    </div>
                    <div>
                        <p class="text-blue-400 font-bold text-sm">You</p>
                        <p class="text-2xl font-black">HP: <span id="player-hp" class="text-white">20</span></p>
                    </div>
                </div>
                
                <!-- プレイヤー手札 -->
                <div id="player-hand" class="flex gap-2 flex-wrap justify-center max-w-4xl min-h-[160px] p-2 mt-auto w-full relative z-20"></div>
            </div>
        </main>
    </div>

    <!-- メッセージモーダル -->
    <div id="message-modal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-[100] hidden opacity-0 transition-opacity backdrop-blur-sm">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-600 max-w-sm w-full mx-4 transform scale-95 transition-transform" id="modal-content">
            <h2 id="modal-title" class="text-2xl font-black mb-2 text-center text-white">Title</h2>
            <p id="modal-desc" class="text-slate-300 text-center mb-6 leading-relaxed">Message Description</p>
            <div class="flex justify-center">
                <button id="btn-modal-close" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-8 rounded-lg shadow transition">
                    OK
                </button>
            </div>
        </div>
    </div>

    <!-- カード詳細モーダル (デッキ編集用) -->
    <div id="card-detail-modal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-[90] hidden">
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-600 max-w-md w-full mx-4 flex gap-4 relative">
            <button id="btn-detail-close" class="absolute top-2 right-3 text-slate-400 hover:text-white text-2xl">&times;</button>
            <div id="detail-card-preview" class="w-32 h-44 shrink-0"></div>
            <div class="flex-1 flex flex-col justify-between">
                <div>
                    <h3 id="detail-name" class="text-xl font-bold text-white mb-1">Card Name</h3>
                    <p id="detail-type" class="text-xs font-bold px-2 py-1 rounded inline-block mb-2">Type</p>
                    <p id="detail-desc" class="text-sm text-slate-300">Description</p>
                </div>
                <button id="btn-add-to-deck" class="mt-4 bg-green-600 hover:bg-green-500 text-white font-bold py-2 rounded shadow transition w-full">
                    デッキに追加
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged, signInWithCustomToken, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment, collection, query, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration (from user)
        const firebaseConfig = {
            apiKey: "AIzaSyCh5NnSyKq648pI-xLwnG-7s7Ogl5vDG-U",
            authDomain: "task0-59261.firebaseapp.com",
            projectId: "task0-59261",
            storageBucket: "task0-59261.firebasestorage.app",
            messagingSenderId: "82069197460",
            appId: "1:82069197460:web:d0a693e1f3d5ffc5fd5a81"
        };
        const defaultAppId = 'tcg-battler-v2';
        const appId = typeof __app_id !== 'undefined' ? __app_id : defaultAppId;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let userId = null;

        const CARD_DB = [];
        const ELEMENTS = [
            {id: 'fire', name: '炎', color: 'bg-red-800 border-red-500', emoji: '🔥'},
            {id: 'water', name: '水', color: 'bg-blue-800 border-blue-500', emoji: '💧'},
            {id: 'grass', name: '草', color: 'bg-green-800 border-green-500', emoji: '🌿'},
            {id: 'electric', name: '雷', color: 'bg-yellow-800 border-yellow-500', emoji: '⚡'}
        ];

        // 1. モンスター (40種: 各属性10種)
        let cardId = 1;
        const monsterNames = [
            ['リザード', 'フレイムドッグ', '火山竜', '火の精霊', 'イフリート', 'マグマゴーレム', '紅蓮鳥', 'フレアバット', '灼熱蛇', 'サラマンダー'],
            ['アクアフィッシュ', '氷晶獣', '海竜', '水の精霊', 'ウンディーネ', 'アイスゴーレム', '蒼翼鳥', 'フロストフロッグ', '深海蛇', 'リヴァイアサン'],
            ['リーフバグ', '森の番人', '樹海竜', '風の精霊', 'シルフ', 'ウッドゴーレム', '翠翼鳥', 'ポイズンフラワー', '蔓蛇', 'ユグドラシル'],
            ['スパークラット', '雷獣', '雷鳴竜', '雷の精霊', 'トール', 'サンダーゴーレム', '金翼鳥', 'ボルトウルフ', '電撃蛇', 'ケツァルコアトル']
        ];
        
        ELEMENTS.forEach((el, elIndex) => {
            monsterNames[elIndex].forEach((name, i) => {
                // 強さのバリエーション
                const tier = i < 4 ? 1 : (i < 7 ? 2 : 3); 
                const hp = 2 + (tier * 2) + Math.floor(Math.random() * 2); // 4~9
                const atk = 1 + tier + Math.floor(Math.random() * 2); // 2~5
                const energyCost = tier; // 1~3
                
                CARD_DB.push({
                    id: cardId++,
                    type: 'monster',
                    element: el.id,
                    name: name,
                    emoji: ['🦎','🐺','🐉','🧚','🧞','🪨','🦅','🦇','🐍','🐲'][i],
                    hp: hp,
                    atk: atk,
                    energyCost: energyCost,
                    color: el.color,
                    desc: `【モンスター】\nHP:${hp} 攻撃:${atk}\n必要エネルギー:${energyCost}`
                });
            });
        });

        // 2. グッズ (8種)
        const goodsData = [
            {name: 'キズぐすり', desc: '味方のHPを2回復', effect: 'heal_2'},
            {name: 'いいキズぐすり', desc: '味方のHPを4回復', effect: 'heal_4'},
            {name: 'モンスターボール', desc: '山札から1枚引く', effect: 'draw_1'},
            {name: 'スーパーボール', desc: '山札から2枚引く', effect: 'draw_2'},
            {name: '力のハチマキ', desc: '味方の攻撃力+1', effect: 'buff_atk_1'},
            {name: 'お守り小判', desc: '味方の最大HP+2', effect: 'buff_hp_2'},
            {name: 'エネルギー転送', desc: '味方のエネルギー+1', effect: 'add_energy_1'},
            {name: '突風', desc: '敵全体に1ダメージ', effect: 'dmg_all_1'}
        ];
        goodsData.forEach(g => {
            CARD_DB.push({
                id: cardId++, type: 'goods', name: g.name, emoji: '🎒', 
                color: 'bg-slate-500 border-slate-400', desc: `【グッズ】\n${g.desc}`, effectId: g.effect
            });
        });

        // 3. サポート (8種 - ターン1回制限を想定)
        const supportData = [
            {name: '博士の研究', desc: '手札を全て捨てて、3枚引く', effect: 'discard_draw_3'},
            {name: 'ジャッジマン', desc: 'お互い手札を捨てて、2枚引く', effect: 'both_discard_draw_2'},
            {name: 'ボスの指令', desc: '敵1体に2ダメージ', effect: 'dmg_target_2'},
            {name: '祈祷師', desc: '自分のHPを5回復', effect: 'heal_player_5'},
            {name: '鍛冶屋', desc: '味方全体にエネルギー+1', effect: 'energy_all_1'},
            {name: '応援団', desc: '味方全体の攻撃力+1', effect: 'buff_all_atk_1'},
            {name: '占い師', desc: '山札から3枚引く', effect: 'draw_3'},
            {name: '暗殺者', desc: '敵1体を確定破壊', effect: 'kill_target'}
        ];
        supportData.forEach(s => {
            CARD_DB.push({
                id: cardId++, type: 'support', name: s.name, emoji: '👤', 
                color: 'bg-fuchsia-800 border-fuchsia-400', desc: `【サポート】\n${s.desc}`, effectId: s.effect
            });
        });

        // 4. エネルギー (4種)
        ELEMENTS.forEach(el => {
            CARD_DB.push({
                id: cardId++, type: 'energy', element: el.id, name: `${el.name}エネルギー`, emoji: el.emoji,
                color: el.color, desc: `【エネルギー】\nモンスターにつけて技のコストにする。`
            });
        });

        function getCardById(id) {
            return CARD_DB.find(c => c.id === id);
        }

        let myDeckIds = []; // ユーザーが組んだデッキ(IDの配列)
        const DECK_LIMIT = 30;

        // ゲームステート
        const gameState = {
            player: { hp: 20, deck: [], hand: [], field: [null, null, null], graveyard: [] },
            enemy: { hp: 20, deck: [], handCount: 0, field: [null, null, null], graveyard: [] },
            turn: 'player', // 'player' or 'enemy'
            turnCount: 1,
            selectedHandIndex: null, // 手札で選択中のカード
            actionTargetState: null, // 'field' (召喚/エネルギー付与), 'enemy' (攻撃/魔法), etc
            supportPlayedThisTurn: false,
            energyPlayedThisTurn: false // 1ターンに1枚制限にする場合 (今回はなし・仕様通り無制限)
        };

        const DOM = {
            views: document.querySelectorAll('.view-section'),
            navBtns: document.querySelectorAll('.nav-btn'),
            userName: document.getElementById('user-name'),
            userWins: document.getElementById('user-wins'),
            loginOverlay: document.getElementById('login-overlay'),
            deckList: document.getElementById('deck-list'),
            deckCount: document.getElementById('deck-count'),
            collectionGrid: document.getElementById('collection-grid'),
            filterType: document.getElementById('filter-type')
        };

        function switchView(targetId) {
            DOM.views.forEach(v => {
                if (v.id === targetId) {
                    v.classList.remove('hidden');
                    // setTimeout(() => v.classList.remove('opacity-0'), 10);
                } else {
                    v.classList.add('hidden');
                    // v.classList.add('opacity-0');
                }
            });
            
            // ナビゲーションのアクティブ状態
            DOM.navBtns.forEach(btn => {
                if (btn.dataset.target === targetId) {
                    btn.classList.add('text-blue-400');
                    btn.classList.remove('text-slate-300');
                } else {
                    btn.classList.remove('text-blue-400');
                    btn.classList.add('text-slate-300');
                }
            });

        document.getElementById('btn-go-deck').addEventListener('click', () => switchView('view-deck'));
        document.getElementById('btn-go-battle').addEventListener('click', () => {

        async function loadUserData() {
            if (!userId) return;
            try {
                // Rule 1: Custom paths
                const userRef = doc(db, 'artifacts', appId, 'users', userId);
                const docSnap = await getDoc(userRef);
                
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    DOM.userWins.textContent = data.wins || 0;
                    myDeckIds = data.deck || generateStarterDeck();
                } else {
                    myDeckIds = generateStarterDeck();
                    await setDoc(userRef, { wins: 0, deck: myDeckIds });
                    DOM.userWins.textContent = "0";
                }
            } catch (e) {
                console.error("Firestore read error", e);
                myDeckIds = generateStarterDeck(); // fallback
            }
        }

        async function saveDeckToDb() {
            if (!userId) return;
            try {
                const userRef = doc(db, 'artifacts', appId, 'users', userId);
                await updateDoc(userRef, { deck: myDeckIds });
                showMessage("保存完了", "デッキを保存しました。");
            } catch (e) {
                console.error("Save deck error", e);
            }
        }

        document.getElementById('btn-save-deck').addEventListener('click', saveDeckToDb);

        function generateStarterDeck() {
            // 初期デッキ: 火と水の混合デッキ (30枚)
            const deck = [];
            // モンスター (12)
            for(let i=0; i<4; i++) deck.push(1); // リザード x4
            for(let i=0; i<4; i++) deck.push(11); // アクアフィッシュ x4
            for(let i=0; i<2; i++) deck.push(3); // 火山竜 x2
            for(let i=0; i<2; i++) deck.push(13); // 海竜 x2
            // グッズ & サポート (8)
            for(let i=0; i<3; i++) deck.push(41); // キズぐすり x3
            for(let i=0; i<3; i++) deck.push(43); // モンスターボール x3
            for(let i=0; i<2; i++) deck.push(49); // 博士の研究 x2
            // エネルギー (10)
            for(let i=0; i<5; i++) deck.push(57); // 炎エネルギー
            for(let i=0; i<5; i++) deck.push(58); // 水エネルギー
            return deck;
        }

        function renderDeckBuilder() {
            // コレクションレンダリング
            DOM.collectionGrid.innerHTML = '';
            const filter = DOM.filterType.value;
            
            CARD_DB.forEach(card => {
                if (filter !== 'all' && card.type !== filter) return;
                
                const cardEl = createVisualCard(card);
                // コレクション内の枚数を表示するなどの工夫も可能
                cardEl.classList.add('cursor-pointer');
                cardEl.onclick = () => openCardDetail(card);
                DOM.collectionGrid.appendChild(cardEl);
            });

            // デッキリストレンダリング
            DOM.deckList.innerHTML = '';
            
            // 種類ごとにソートして表示
            const sortedDeck = [...myDeckIds].map(id => getCardById(id)).sort((a, b) => {
                const typeOrder = { 'monster': 1, 'goods': 2, 'support': 3, 'energy': 4 };
                if (typeOrder[a.type] !== typeOrder[b.type]) return typeOrder[a.type] - typeOrder[b.type];
                return a.id - b.id;
            });

            sortedDeck.forEach((card, index) => {
                const item = document.createElement('div');
                item.className = 'flex justify-between items-center bg-slate-700 p-2 rounded shadow-sm hover:bg-slate-600 transition';
                item.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="text-xl">${card.emoji}</span>
                        <span class="text-sm font-bold text-white">${card.name}</span>
                        <span class="text-xs px-1 rounded ${card.color} text-white">${card.type.substring(0,3).toUpperCase()}</span>
                    </div>
                    <button class="text-red-400 hover:text-red-300 font-bold px-2 py-1 rounded">&times;</button>
                `;
                item.querySelector('button').onclick = () => removeCardFromDeck(index, sortedDeck);
                DOM.deckList.appendChild(item);
            });

            DOM.deckCount.textContent = myDeckIds.length;
            if(myDeckIds.length === DECK_LIMIT) DOM.deckCount.classList.add('text-green-400');
            else DOM.deckCount.classList.remove('text-green-400');
        }

        DOM.filterType.addEventListener('change', renderDeckBuilder);

        function openCardDetail(card) {
            const modal = document.getElementById('card-detail-modal');
            document.getElementById('detail-name').textContent = card.name;
            
            let typeStr = "";
            if (card.type === 'monster') typeStr = `モンスター (${card.element})`;
            else if (card.type === 'energy') typeStr = `エネルギー (${card.element})`;
            else typeStr = card.type === 'goods' ? 'グッズ' : 'サポート';
            
            document.getElementById('detail-type').textContent = typeStr;
            document.getElementById('detail-type').className = `text-xs font-bold px-2 py-1 rounded inline-block mb-2 text-white ${card.color}`;
            
            document.getElementById('detail-desc').innerText = card.desc;
            
            const preview = document.getElementById('detail-card-preview');
            preview.innerHTML = '';
            preview.appendChild(createVisualCard(card, false));

            const addBtn = document.getElementById('btn-add-to-deck');
            addBtn.onclick = () => {
                if (canAddCardToDeck(card)) {
                    myDeckIds.push(card.id);
                    renderDeckBuilder();
                    modal.classList.add('hidden');
                }
            };

            modal.classList.remove('hidden');
        }
        
        document.getElementById('btn-detail-close').addEventListener('click', () => {
            document.getElementById('card-detail-modal').classList.add('hidden');
        });

        function canAddCardToDeck(card) {
            if (myDeckIds.length >= DECK_LIMIT) {
                showMessage("制限", `デッキは最大${DECK_LIMIT}枚です。`);
                return false;
            }
            if (card.type !== 'energy') {
                const count = myDeckIds.filter(id => id === card.id).length;
                if (count >= 4) {
                    showMessage("制限", "同名のモンスター・グッズ・サポートはデッキに4枚までしか入れられません。");
                    return false;
                }
            }
            return true;
        }

        function removeCardFromDeck(visualIndex, sortedDeck) {
            // sortedDeckの該当カードIDを取得し、myDeckIdsから1つ削除
            const idToRemove = sortedDeck[visualIndex].id;
            const idx = myDeckIds.indexOf(idToRemove);
            if (idx > -1) {
                myDeckIds.splice(idx, 1);
                renderDeckBuilder();
            }
        }

        function createVisualCard(card, isSmall = false) {

            if (isSmall) {
                div.className = `card w-20 h-28 sm:w-24 sm:h-32 rounded-xl border-2 flex flex-col justify-between p-1 bg-opacity-90 shadow-md ${card.color} relative overflow-hidden`;

                div.className = `card w-full h-full rounded-xl border-2 flex flex-col justify-between p-2 bg-opacity-90 shadow-lg ${card.color} relative overflow-hidden`;
            }
            
            let statsHtml = '';
            if (card.type === 'monster') {
                statsHtml = `
                    <div class="flex justify-between items-center text-xs font-bold bg-black bg-opacity-60 px-1 py-0.5 rounded w-full mt-auto">
                        <span class="text-yellow-400 flex items-center">⚔️${card.atk}</span>
                        <span class="text-blue-300 flex items-center">⚡${card.energyCost}</span>
                        <span class="text-red-400 flex items-center">❤️${card.hp}</span>
                    </div>
                `;
            } else {
                statsHtml = `
                    <div class="text-[10px] sm:text-xs text-white bg-black bg-opacity-60 px-1 py-0.5 rounded text-center truncate mt-auto">
                        ${card.type.toUpperCase()}
                    </div>
                `;
            }

            // Energy Indicators for Battle Field

                for(let i=0; i<card.attachedEnergy; i++){
                    energyIndicators += `<div class="w-4 h-4 bg-yellow-400 rounded-full border border-yellow-700 shadow flex justify-center items-center text-[8px]">⚡</div>`;

                <div class="text-3xl sm:text-4xl text-center my-auto filter drop-shadow-lg">${card.emoji}</div>

        function createCardBackElement(isSmall = false) {
            const div = document.createElement('div');
            const size = isSmall ? 'w-20 h-28 sm:w-24 sm:h-32' : 'w-24 h-32 sm:w-28 sm:h-40';
            div.className = `${size} rounded-xl border-2 border-slate-600 bg-[url('https://placehold.co/100x150/1e293b/3b82f6?text=TCG')] bg-cover bg-center shadow-lg flex items-center justify-center`;
            return div;
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startBattle() {
            // プレイヤー初期化
            gameState.player.hp = 20;
            // myDeckIds からカードオブジェクトのクローンを生成してデッキとする
            gameState.player.deck = shuffle([...myDeckIds].map(id => ({...getCardById(id)})));
            gameState.player.hand = [];
            gameState.player.field = [null, null, null];
            gameState.player.graveyard = [];

            // AI初期化 (AIは少しズルして、固定のバランスデッキを使う)
            gameState.enemy.hp = 20;
            const aiDeckIds = generateStarterDeck(); 
            gameState.enemy.deck = shuffle([...aiDeckIds].map(id => ({...getCardById(id)})));
            gameState.enemy.handCount = 0;
            gameState.enemy.field = [null, null, null];
            
            gameState.turn = 'player';
            gameState.turnCount = 1;
            
            // 初手ドロー
            for(let i=0; i<5; i++){ drawCard('player'); drawCard('enemy'); }
            
            startTurn('player');
        }

        function drawCard(target, amount = 1) {
            for(let i=0; i<amount; i++) {
                if (target === 'player') {
                    if (gameState.player.deck.length > 0 && gameState.player.hand.length < 10) {
                        gameState.player.hand.push(gameState.player.deck.pop());
                    }
                } else {
                    if (gameState.enemy.deck.length > 0) {
                        gameState.enemy.deck.pop();
                        gameState.enemy.handCount++;
                    }
                }
            }
            renderBattle();
        }

        function renderBattle() {
            // UI更新
            document.getElementById('player-hp').textContent = gameState.player.hp;
            document.getElementById('enemy-hp').textContent = gameState.enemy.hp;
            document.getElementById('player-deck-count').textContent = gameState.player.deck.length;
            document.getElementById('enemy-deck-count').textContent = gameState.enemy.deck.length;

            const isPlayerTurn = gameState.turn === 'player';

            // プレイヤー手札
            const pHand = document.getElementById('player-hand');
            pHand.innerHTML = '';
            gameState.player.hand.forEach((card, index) => {
                const el = createVisualCard(card, true);
                if (isPlayerTurn) {
                    el.classList.add('playable', 'cursor-pointer');
                    el.onclick = () => selectHandCard(index);
                    if (gameState.selectedHandIndex === index) {
                        el.classList.add('selected');
                    }
                }
                pHand.appendChild(el);
            });

            // 敵手札
            const eHand = document.getElementById('enemy-hand');
            eHand.innerHTML = '';
            for(let i=0; i<gameState.enemy.handCount; i++){
                eHand.appendChild(createCardBackElement(true));
            }

            // プレイヤーフィールド
            const pField = document.getElementById('player-field');
            pField.innerHTML = '';
            gameState.player.field.forEach((card, index) => {
                if (card) {
                    const el = createVisualCard(card, false);
                    if (isPlayerTurn) {
                        // アクション対象としてのハイライト
                        if (gameState.selectedHandIndex !== null) {
                            const selCard = gameState.player.hand[gameState.selectedHandIndex];
                            if (selCard.type === 'energy' || selCard.type === 'goods' || selCard.type === 'support') {
                                el.classList.add('highlight-energy');
                                el.onclick = () => playCardToField(index);
                            }
                        } 
                        // 攻撃選択
                        else if (!card.isSleeping && card.attachedEnergy >= card.energyCost) {
                            el.classList.add('cursor-pointer', 'hover:border-yellow-400');
                            el.onclick = () => selectAttacker(index);
                            if (gameState.actionTargetState === `attack_${index}`) {
                                el.classList.add('selected');
                            }
                        }
                    }
                    pField.appendChild(el);
                } else {
                    const el = document.createElement('div');
                    el.className = `slot w-24 h-32 sm:w-28 sm:h-40 border-2 border-dashed border-slate-500 rounded-xl bg-slate-800 bg-opacity-50 flex items-center justify-center text-slate-500`;
                    
                    if (isPlayerTurn && gameState.selectedHandIndex !== null) {
                        const selCard = gameState.player.hand[gameState.selectedHandIndex];
                        if (selCard.type === 'monster') {
                            el.classList.add('highlight');
                            el.onclick = () => playCardToField(index);
                            el.textContent = "召喚";
                        }
                    }
                    pField.appendChild(el);
                }
            });

            // 敵フィールド
            const eField = document.getElementById('enemy-field');
            eField.innerHTML = '';
            gameState.enemy.field.forEach((card, index) => {
                if (card) {
                    const el = createVisualCard(card, false);
                    // 攻撃ターゲットとしてのハイライト
                    if (isPlayerTurn && gameState.actionTargetState && gameState.actionTargetState.startsWith('attack_')) {
                        el.classList.add('enemy-targetable');
                        el.onclick = () => executeAttack(index);
                    }
                    eField.appendChild(el);
                } else {
                    const el = document.createElement('div');
                    el.className = `slot w-24 h-32 sm:w-28 sm:h-40 border-2 border-dashed border-slate-600 rounded-xl bg-slate-800 bg-opacity-50`;
                    eField.appendChild(el);
                }
            });

            // UI Buttons & Indicators
            const turnInd = document.getElementById('turn-indicator');
            const endBtn = document.getElementById('btn-end-turn');
            if (isPlayerTurn) {
                turnInd.textContent = `TURN ${gameState.turnCount}: あなたのターン`;
                turnInd.className = "font-bold text-lg px-6 py-1 rounded-full bg-blue-900 text-blue-200 border border-blue-500 shadow-[0_0_10px_rgba(59,130,246,0.5)] transition-all";
                endBtn.classList.remove('hidden');
                
                // Direct Attack targeting
                const enemyHeroBox = document.getElementById('enemy-hp').parentElement.parentElement;
                if (gameState.actionTargetState && gameState.actionTargetState.startsWith('attack_')) {
                    enemyHeroBox.classList.add('cursor-crosshair', 'hover:bg-red-900', 'border-red-500', 'shadow-[0_0_15px_rgba(239,68,68,0.8)]');
                    enemyHeroBox.onclick = () => executeAttack('hero');
                } else {
                    enemyHeroBox.classList.remove('cursor-crosshair', 'hover:bg-red-900', 'border-red-500', 'shadow-[0_0_15px_rgba(239,68,68,0.8)]');
                    enemyHeroBox.onclick = null;
                }

            } else {
                turnInd.textContent = `TURN ${gameState.turnCount}: 敵のターン`;
                turnInd.className = "font-bold text-lg px-6 py-1 rounded-full bg-red-900 text-red-200 border border-red-500 shadow-[0_0_10px_rgba(239,68,68,0.5)] transition-all";
                endBtn.classList.add('hidden');
            }
        }

        function startTurn(actor) {
            gameState.turn = actor;
            gameState.selectedHandIndex = null;
            gameState.actionTargetState = null;
            gameState.supportPlayedThisTurn = false;
            
            // フィールドの召喚酔い解除
            gameState[actor].field.forEach(card => {
                if (card) card.isSleeping = false;
            });
            
            drawCard(actor, 1);
            
            if (actor === 'player') {
                renderBattle();
            } else {
                aiTurn();
            }
        }

        function selectHandCard(index) {
            const card = gameState.player.hand[index];
            
            // Toggle selection
            if (gameState.selectedHandIndex === index) {
                gameState.selectedHandIndex = null;
            } else {
                if (card.type === 'support' && gameState.supportPlayedThisTurn) {
                    showMessage("制限", "サポートカードは1ターンに1枚しか使えません。");
                    return;
                }
                gameState.selectedHandIndex = index;
                gameState.actionTargetState = null; // reset attack targeting
                
                // もし対象を取らないカードなら即座に発動
                if (['support', 'goods'].includes(card.type)) {
                    if (['draw_1', 'draw_2', 'draw_3', 'discard_draw_3', 'both_discard_draw_2', 'dmg_all_1'].includes(card.effectId)) {
                        // Confirm to play? For simplicity, we just execute.
                        playMagicCardInstant(index);
                    }
                }
            }
            renderBattle();
        }

        function playCardToField(fieldIndex) {
            if (gameState.selectedHandIndex === null) return;
            const card = gameState.player.hand[gameState.selectedHandIndex];
            const targetMonster = gameState.player.field[fieldIndex];

            if (card.type === 'monster') {
                if (targetMonster !== null) return; // slot full
                card.isSleeping = true;
                card.attachedEnergy = 0;
                gameState.player.field[fieldIndex] = card;
            } 
            else if (card.type === 'energy') {
                if (targetMonster === null) return;
                targetMonster.attachedEnergy++;
            }
            else if (['goods', 'support'].includes(card.type)) {
                if (targetMonster === null) return;
                applyMagicEffect(card, targetMonster, 'player', fieldIndex);
                if(card.type === 'support') gameState.supportPlayedThisTurn = true;
            }

            // Remove from hand
            gameState.player.hand.splice(gameState.selectedHandIndex, 1);
            gameState.selectedHandIndex = null;
            renderBattle();
        }

        function playMagicCardInstant(handIndex) {
            const card = gameState.player.hand[handIndex];
            applyMagicEffect(card, null, 'player', null); // Global effect
            if(card.type === 'support') gameState.supportPlayedThisTurn = true;
            gameState.player.hand.splice(handIndex, 1);
            gameState.selectedHandIndex = null;
            renderBattle();
        }

        function applyMagicEffect(card, targetMonster, actor, targetIndex) {
            const targetPlayer = actor === 'player' ? gameState.player : gameState.enemy;
            const enemyPlayer = actor === 'player' ? gameState.enemy : gameState.player;
            
            switch (card.effectId) {
                case 'heal_2': if(targetMonster) targetMonster.hp += 2; break;
                case 'heal_4': if(targetMonster) targetMonster.hp += 4; break;
                case 'draw_1': drawCard(actor, 1); break;
                case 'draw_2': drawCard(actor, 2); break;
                case 'draw_3': drawCard(actor, 3); break;
                case 'buff_atk_1': if(targetMonster) targetMonster.atk += 1; break;
                case 'buff_hp_2': if(targetMonster) targetMonster.hp += 2; break;
                case 'add_energy_1': if(targetMonster) targetMonster.attachedEnergy += 1; break;
                case 'dmg_all_1':
                    enemyPlayer.field.forEach((c, idx) => { if(c) damageMonster(enemyPlayer, idx, 1); });
                    break;
                case 'discard_draw_3':
                    targetPlayer.hand = [];
                    if(actor==='enemy') targetPlayer.handCount=0;
                    drawCard(actor, 3);
                    break;
                case 'both_discard_draw_2':
                    gameState.player.hand = []; drawCard('player', 2);
                    gameState.enemy.handCount = 0; drawCard('enemy', 2);
                    break;
            }
        }

        function selectAttacker(index) {
            gameState.selectedHandIndex = null;
            if (gameState.actionTargetState === `attack_${index}`) {
                gameState.actionTargetState = null;
            } else {
                gameState.actionTargetState = `attack_${index}`;
            }
            renderBattle();
        }

        function executeAttack(targetIndex) {
            if (!gameState.actionTargetState || !gameState.actionTargetState.startsWith('attack_')) return;
            const attackerIndex = parseInt(gameState.actionTargetState.split('_')[1]);
            const attacker = gameState.player.field[attackerIndex];
            
            if (!attacker || attacker.isSleeping || attacker.attachedEnergy < attacker.energyCost) return;

            if (targetIndex === 'hero') {
                // 挑発ルール（簡易）: 敵フィールドにモンスターがいたらダイレクトアタック不可
                const hasEnemy = gameState.enemy.field.some(c => c !== null);
                if (hasEnemy) {
                    showMessage("攻撃不可", "敵フィールドにモンスターがいるため、直接攻撃できません！");
                    gameState.actionTargetState = null;
                    renderBattle();
                    return;
                }
                gameState.enemy.hp -= attacker.atk;
            } else {
                damageMonster(gameState.enemy, targetIndex, attacker.atk);
            }

            // Consume attack state (Sleeping) and energy cost
            attacker.isSleeping = true; 
            // 攻撃でエネルギーを消費するルールならここで減らす（通常は減らないので今回は減らさない）
            // attacker.attachedEnergy -= attacker.energyCost; 

            gameState.actionTargetState = null;
            renderBattle();
            checkWinCondition();
        }

        function damageMonster(playerState, index, amount) {
            const m = playerState.field[index];
            if (!m) return;
            m.hp -= amount;
            if (m.hp <= 0) {
                playerState.field[index] = null;
                // playerState.graveyard.push(m);
            }
        }

        async function aiTurn() {
            renderBattle();
            await sleep(1000);

            // 1. 手札からモンスターを出す
            const emptySlots = gameState.enemy.field.map((c, i) => c === null ? i : -1).filter(i => i !== -1);
            if (gameState.enemy.handCount > 0 && emptySlots.length > 0) {
                // AIの手札は実際には見えないが、確率でモンスターを引いたことにして召喚する
                gameState.enemy.handCount--;
                const randomMonster = {...getCardById(Math.floor(Math.random() * 40) + 1)}; 
                randomMonster.isSleeping = true;
                randomMonster.attachedEnergy = 0;
                const slot = emptySlots[Math.floor(Math.random() * emptySlots.length)];
                gameState.enemy.field[slot] = randomMonster;
                renderBattle();
                await sleep(1000);
            }

            // 2. フィールドのモンスターにエネルギーをつける (1ターン1回確率で)
            const monsters = gameState.enemy.field.map((c, i) => c !== null ? i : -1).filter(i => i !== -1);
            if (monsters.length > 0 && Math.random() > 0.3) {
                const targetIdx = monsters[Math.floor(Math.random() * monsters.length)];
                gameState.enemy.field[targetIdx].attachedEnergy++;
                renderBattle();
                await sleep(800);
            }

            // 3. 攻撃可能なモンスターで攻撃
            for (let i = 0; i < gameState.enemy.field.length; i++) {
                const attacker = gameState.enemy.field[i];
                if (attacker && !attacker.isSleeping && attacker.attachedEnergy >= attacker.energyCost) {
                    
                    const playerMonsters = gameState.player.field.map((c, idx) => c !== null ? idx : -1).filter(idx => idx !== -1);
                    
                    if (playerMonsters.length > 0) {
                        // ランダムなプレイヤーモンスターを攻撃
                        const targetIdx = playerMonsters[Math.floor(Math.random() * playerMonsters.length)];
                        damageMonster(gameState.player, targetIdx, attacker.atk);
                    } else {
                        // 直接攻撃
                        gameState.player.hp -= attacker.atk;
                    }
                    attacker.isSleeping = true;
                    renderBattle();
                    
                    if (await checkWinCondition()) return;
                    await sleep(1000);
                }
            }

            gameState.turnCount++;
            startTurn('player');
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function checkWinCondition() {
            if (gameState.enemy.hp <= 0) {
                showMessage("勝利！", "敵を打ち倒しました！", () => switchView('view-menu'));
                if (userId) {
                    try {
                        const userRef = doc(db, 'artifacts', appId, 'users', userId);
                        await updateDoc(userRef, { wins: increment(1) });
                        DOM.userWins.textContent = parseInt(DOM.userWins.textContent) + 1;
                    } catch (e) { console.error(e); }
                }
                return true;
            } else if (gameState.player.hp <= 0) {
                showMessage("敗北...", "あなたのHPが0になりました。", () => switchView('view-menu'));
                return true;
            } else if (gameState.player.deck.length === 0) {
                showMessage("敗北...", "山札がなくなりました。", () => switchView('view-menu'));
                return true;
            }
            return false;
        }

        document.getElementById('btn-end-turn').addEventListener('click', () => {
            if (gameState.turn === 'player') {
                gameState.turnCount++;
                startTurn('enemy');
            }
        });

        // カスタムモーダル (alert代替)
        function showMessage(title, description, onConfirm = null) {
            const modal = document.getElementById('message-modal');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-desc').textContent = description;
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                document.getElementById('modal-content').classList.remove('scale-95');
            }, 10);

            const btn = document.getElementById('btn-modal-close');
            const handler = () => {
                modal.classList.add('opacity-0');
                document.getElementById('modal-content').classList.add('scale-95');
                setTimeout(() => modal.classList.add('hidden'), 300);
                btn.removeEventListener('click', handler);
                if (onConfirm) onConfirm();
            };
            // 既存のリスナーを消す
            const newBtn = btn.cloneNode(true);
            btn.parentNode.replaceChild(newBtn, btn);
            newBtn.addEventListener('click', handler);
        }

    </script>
</body>
</html>
